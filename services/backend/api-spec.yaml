      tags:
        - Authentication
      description: "Allows authenticated users to update their profile information
        including username, first name, and last name. Requires an active
        session. At least one field must be provided. Requires Content-Type:
        application/json header when sending request body."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: ^[a-zA-Z0-9_]+$
                first_name:
                  type: string
                  maxLength: 50
                last_name:
                  type: string
                  maxLength: 50
              additionalProperties: false
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Profile updated successfully
                  type: object
                  properties:
                    success:
                      description: Indicates if the profile update was successful
                      type: boolean
                    message:
                      description: Success message
                      type: string
                    user:
                      description: Updated user information
                      type: object
                      properties:
                        id:
                          description: User ID
                          type: string
                        username:
                          description: Updated username
                          type: string
                        email:
                          description: User email
                          type: string
                        first_name:
                          description: Updated first name
                          anyOf:
                            - type: string
                            - type: "null"
                        last_name:
                          description: Updated last name
                          anyOf:
                            - type: string
                            - type: "null"
                        auth_type:
                          description: Authentication type
                          type: string
                        role_id:
                          description: User role ID
                          anyOf:
                            - type: string
                            - type: "null"
                      required:
                        - id
                        - username
                        - email
                        - first_name
                        - last_name
                        - auth_type
                        - role_id
                      additionalProperties: false
                  required:
                    - success
                    - message
                    - user
                  additionalProperties: false
                components: {}
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Bad Request - Invalid input, no fields provided, username already
                    taken, or missing Content-Type header
                  type: object
                  properties:
                    success:
                      default: false
                      description: Indicates if the operation was successful (false for errors)
                      type: boolean
                    error:
                      description: Error message describing what went wrong
                      type: string
                  required:
                    - success
                    - error
                  additionalProperties: false
                components: {}
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Unauthorized - Authentication required
                  type: object
                  properties:
                    success:
                      default: false
                      description: Indicates if the operation was successful (false for errors)
                      type: boolean
                    error:
                      description: Error message describing what went wrong
                      type: string
                  required:
                    - success
                    - error
                  additionalProperties: false
                components: {}
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Forbidden - Cannot change username for non-email users
                  type: object
                  properties:
                    success:
                      default: false
                      description: Indicates if the operation was successful (false for errors)
                      type: boolean
                    error:
