                  description: Bad Request - Invalid input, username taken, email already in use,
                    or missing Content-Type header
                  type: object
                  properties:
                    success:
                      default: false
                      description: Indicates if the operation was successful (false for errors)
                      type: boolean
                    error:
                      description: Error message describing what went wrong
                      type: string
                  required:
                    - success
                    - error
                  additionalProperties: false
                components: {}
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Forbidden - Email registration is disabled by administrator
