        "401":
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful (false for errors)
                    default: false
                  error:
                    type: string
                    description: Error message
                  details:
                    description: Additional error details (validation errors, invalid permissions)
                required:
                  - error
                additionalProperties: false
                description: Unauthorized - Authentication required
        "403":
          description: Forbidden - Insufficient permissions or cannot update system roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful (false for errors)
