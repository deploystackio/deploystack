        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful (false for errors)
                    default: false
                  error:
                    type: string
                    description: Error message
                  details:
                    description: Additional error details (validation errors, invalid permissions)
