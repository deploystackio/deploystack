  /api/auth/github/login:
    get:
      summary: Initiate GitHub OAuth login
      tags:
        - Authentication
      description: Redirects the user to GitHub for OAuth authentication. This
        endpoint generates a state parameter for CSRF protection and redirects
        to GitHub's authorization URL.
      responses:
        "302":
          description: Redirect to GitHub OAuth authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    description: HTTP status code
                  headers:
                    type: object
                    properties:
                      location:
                        type: string
                        description: Redirect URL
                    required:
                      - location
                    additionalProperties: false
                    description: Response headers
                required:
                  - statusCode
                  - headers
                additionalProperties: false
                description: Redirect to GitHub OAuth authorization URL
        "403":
          description: Forbidden - Login is disabled by administrator or GitHub OAuth is
            disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
                additionalProperties: false
                description: Forbidden - Login is disabled by administrator or GitHub OAuth is
                  disabled
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
                additionalProperties: false
                description: Internal Server Error
  /api/auth/github/callback:
    get:
      summary: GitHub OAuth callback
      tags:
        - Authentication
      description: Handles the OAuth callback from GitHub after user authorization.
        Validates the state parameter, exchanges the authorization code for
        tokens, retrieves user information, and creates or links user accounts.
        Sets authentication session cookie on success.
      parameters:
        - schema:
            type: string
          in: query
          name: code
          required: true
        - schema:
            type: string
          in: query
          name: state
          required: true
      responses:
        "302":
          description: Redirect to frontend after successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    description: HTTP status code
                  headers:
                    type: object
                    properties:
                      location:
                        type: string
                        description: Redirect URL
                    required:
                      - location
                    additionalProperties: false
                    description: Response headers
                required:
                  - statusCode
                  - headers
                additionalProperties: false
                description: Redirect to frontend after successful authentication
        "400":
          description: Bad Request - Invalid state parameter, OAuth error, or GitHub email
            not available
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
                additionalProperties: false
                description: Bad Request - Invalid state parameter, OAuth error, or GitHub email
                  not available
        "403":
          description: Forbidden - Login is disabled by administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
                additionalProperties: false
                description: Forbidden - Login is disabled by administrator
        "409":
          description: Conflict - User account conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
                additionalProperties: false
                description: Conflict - User account conflict
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
                additionalProperties: false
                description: Internal Server Error
  /api/auth/github/status:
    get:
      summary: Check GitHub OAuth status
      tags:
        - Authentication
      description: Returns whether GitHub OAuth is enabled and configured. This
        endpoint can be used by the frontend to determine whether to show the
        "Login with GitHub" button.
      responses:
        "200":
          description: GitHub OAuth status information
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: Whether GitHub OAuth is enabled and properly configured
                  configured:
                    type: boolean
                    description: Whether GitHub OAuth settings are present (regardless of enabled
                      status)
                required:
                  - enabled
                  - configured
                additionalProperties: false
                description: GitHub OAuth status information
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
                additionalProperties: false
                description: Internal Server Error
  /api/auth/logout:
    post:
      summary: User logout
      tags:
        - Authentication
      description: Invalidates the current user session and clears authentication
        cookies. This endpoint can be called even without an active session.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: '{"examples":[{"success":true,"message":"Logged out
            successfully."},{"success":true,"message":"No active session to
            logout or already logged out."}]}'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the logout operation was successful
                  message:
                    type: string
                    description: Human-readable message about the logout result
                required:
                  - success
                  - message
                additionalProperties: false
                description: '{"examples":[{"success":true,"message":"Logged out
                  successfully."},{"success":true,"message":"No active session
                  to logout or already logged out."}]}'
              examples:
                example1:
                  value:
                    success: true
                    message: Logged out successfully.
                example2:
                  value:
                    success: true
                    message: No active session to logout or already logged out.
