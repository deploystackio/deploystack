  /api/users:
    get:
      summary: List all users
      tags:
        - Users
      description: Retrieves a list of all users in the system. Requires admin permissions.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Successfully retrieved users list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        username:
                          type: string
                        email:
                          type: string
                        auth_type:
                          type: string
                        first_name:
                          type: string
                          nullable: true
                        last_name:
                          type: string
                          nullable: true
                        github_id:
                          type: string
                          nullable: true
                        role_id:
                          type: string
                          nullable: true
                        role:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            permissions:
                              type: array
                              items:
                                type: string
                          required:
                            - id
                            - name
                            - permissions
                          additionalProperties: false
                      required:
                        - id
                        - username
                        - email
                        - auth_type
                        - first_name
                        - last_name
                        - github_id
                        - role_id
                      additionalProperties: false
                    description: Array of users
                required:
                  - success
                  - data
                additionalProperties: false
                description: Successfully retrieved users list
        "401":
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful (false for errors)
                    default: false
                  error:
                    type: string
                    description: Error message
                  details:
                    type: array
                    description: Additional error details (validation errors)
                required:
                  - error
                additionalProperties: false
                description: Unauthorized - Authentication required
