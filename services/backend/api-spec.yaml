                        last_name:
                          description: User's last name
                          anyOf:
                            - type: string
                            - type: "null"
                        role_id:
                          description: User's role ID
                          type: string
                      required:
                        - id
                        - username
                        - email
                        - first_name
                        - last_name
                        - role_id
                      additionalProperties: false
                  required:
