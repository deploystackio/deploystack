              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful (false for errors)
                    default: false
                  error:
                    type: string
                    description: Error message
                  details:
                    description: Additional error details (validation errors, invalid permissions)
                required:
                  - error
                additionalProperties: false
                description: Internal Server Error
    delete:
      summary: Delete role
      tags:
        - Roles
      description: Deletes a role from the system. System roles and roles assigned to
        users cannot be deleted. Requires role management permissions.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
          description: Role ID
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Role deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful
                  message:
