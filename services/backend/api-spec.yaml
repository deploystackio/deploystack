openapi: 3.0.0
info:
  title: DeployStack Backend API
  description: API documentation for DeployStack Backend
  version: 0.20.5
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth2 Bearer token authentication
  schemas: {}
paths:
  /api/plugin/example-plugin/examples:
    get:
      responses:
        "200":
          description: Default Response
  /api/plugin/example-plugin/examples/{id}:
    get:
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /api/plugin/example-plugin/health:
    get:
      responses:
        "200":
          description: Default Response
  /:
    get:
      summary: API health check
      tags:
        - Health Check
      description: Returns the health status of the DeployStack Backend API, including
        database connection status and basic service information. This endpoint
        can be used for monitoring and health checks.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: API health check information
                  type: object
                  properties:
                    message:
                      description: Service status message
                      type: string
                    status:
                      description: Database connection status
                      type: string
                    timestamp:
                      description: Current server timestamp
                      type: string
                    version:
                      description: API version (configurable via global.show_version setting)
                      type: string
                  required:
                    - message
                    - status
                    - timestamp
                  additionalProperties: false
                components: {}
  /api/health:
    get:
      summary: Simple API health check
      tags:
        - Health Check
      description: Returns basic API health status for monitoring, load balancers, and
        uptime checks. No Content-Type header required for this GET request.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Simple health check response
                  type: object
                  properties:
                    status:
                      description: Health status indicator
                      type: string
                      enum:
                        - ok
                  required:
                    - status
                  additionalProperties: false
                components: {}
  /api/db/status:
    get:
      summary: Get database status
      tags:
        - Database
      description: Returns the current status of the database configuration and
        initialization. This endpoint checks whether the database has been
        configured and properly initialized.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Database status information
                  type: object
                  properties:
                    configured:
                      type: boolean
                    initialized:
                      type: boolean
                    dialect:
                      anyOf:
                        - type: string
                          enum:
                            - sqlite
                            - turso
                        - type: "null"
                  required:
                    - configured
                    - initialized
                    - dialect
                  additionalProperties: false
                components: {}
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Internal Server Error - Failed to fetch database status
                  type: object
                  properties:
                    error:
                      description: Error message describing what went wrong.
                      type: string
                  required:
                    - error
                  additionalProperties: false
                components: {}
  /api/db/setup:
    post:
      summary: Setup database
      tags:
        - Database
      description: Initializes and configures the database for the DeployStack
        application. This endpoint sets up the database schema, creates
        necessary tables, and initializes database-dependent services. Can only
        be called once - subsequent calls will return a conflict error.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Database setup completed successfully
                  type: object
                  properties:
                    message:
                      description: Success message indicating the database setup status.
                      type: string
                    restart_required:
                      description: Indicates whether a server restart is required to complete the
                        setup.
                      type: boolean
                    database_type:
                      description: The type of database that was configured.
                      type: string
                  required:
                    - message
                    - restart_required
                    - database_type
                  additionalProperties: false
                components: {}
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Bad Request - Invalid input or unsupported database type
                  type: object
                  properties:
                    error:
                      description: Error message describing what went wrong.
                      type: string
                    details:
                      description: Additional error details.
                  required:
                    - error
                  additionalProperties: false
                components: {}
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Conflict - Database setup has already been performed
                  type: object
                  properties:
                    message:
                      description: Message indicating that database setup has already been performed.
                      type: string
                    database_type:
                      description: The type of database that is currently configured.
                      type: string
                  required:
                    - message
                    - database_type
                  additionalProperties: false
                components: {}
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Internal Server Error - Database setup failed
                  type: object
                  properties:
                    error:
                      description: Error message describing what went wrong.
                      type: string
                    details:
                      description: Additional error details.
                  required:
                    - error
                  additionalProperties: false
                components: {}
  /api/roles:
    get:
      summary: List all roles
      tags:
        - Roles
      description: Retrieves a list of all roles in the system. Requires role
        management permissions.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Successfully retrieved roles list
                  type: object
                  properties:
                    success:
                      description: Indicates if the operation was successful
                      type: boolean
                    data:
                      description: Array of roles
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          description:
                            anyOf:
                              - type: string
                              - type: "null"
                          permissions:
                            type: array
                            items:
                              type: string
                          is_system_role:
                            type: boolean
                          created_at:
                            type: string
                          updated_at:
                            type: string
                        required:
                          - id
                          - name
                          - description
                          - permissions
                          - is_system_role
                          - created_at
                          - updated_at
                        additionalProperties: false
                  required:
                    - success
                    - data
                  additionalProperties: false
                components: {}
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Unauthorized - Authentication required
                  type: object
                  properties:
                    success:
                      default: false
                      description: Indicates if the operation was successful (false for errors)
                      type: boolean
                    error:
                      description: Error message
                      type: string
                    details:
                      description: Additional error details (validation errors, invalid permissions)
                  required:
                    - success
                    - error
                  additionalProperties: false
                components: {}
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Forbidden - Insufficient permissions
                  type: object
                  properties:
                    success:
                      default: false
                      description: Indicates if the operation was successful (false for errors)
                      type: boolean
                    error:
                      description: Error message
                      type: string
                    details:
                      description: Additional error details (validation errors, invalid permissions)
                  required:
                    - success
                    - error
                  additionalProperties: false
                components: {}
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Internal Server Error
                  type: object
                  properties:
                    success:
                      default: false
                      description: Indicates if the operation was successful (false for errors)
                      type: boolean
                    error:
                      description: Error message
                      type: string
                    details:
                      description: Additional error details (validation errors, invalid permissions)
                  required:
                    - success
                    - error
                  additionalProperties: false
                components: {}
    post:
      summary: Create new role
      tags:
        - Roles
      description: Creates a new role with specified permissions. Requires role
        management permissions.
      requestBody:
        content:
          application/json:
            schema:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                  name:
                    type: string
                    minLength: 1
                  description:
                    type: string
                  permissions:
                    minItems: 1
                    type: array
                    items:
                      type: string
                required:
                  - id
                  - name
                  - permissions
                additionalProperties: false
              components: {}
      security:
        - cookieAuth: []
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Role created successfully
                  type: object
                  properties:
                    success:
                      description: Indicates if the operation was successful
                      type: boolean
                    data:
                      description: Role data
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          anyOf:
                            - type: string
                            - type: "null"
                        permissions:
                          type: array
                          items:
                            type: string
                        is_system_role:
                          type: boolean
                        created_at:
                          type: string
                        updated_at:
                          type: string
                      required:
                        - id
                        - name
                        - description
                        - permissions
                        - is_system_role
                        - created_at
                        - updated_at
                      additionalProperties: false
                    message:
                      description: Success message
                      type: string
                  required:
                    - success
                  additionalProperties: false
                components: {}
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Bad Request - Validation error or invalid permissions
                  type: object
                  properties:
                    success:
                      default: false
                      description: Indicates if the operation was successful (false for errors)
                      type: boolean
                    error:
                      description: Error message
                      type: string
                    details:
                      description: Additional error details (validation errors, invalid permissions)
                  required:
                    - success
                    - error
                  additionalProperties: false
                components: {}
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Unauthorized - Authentication required
                  type: object
                  properties:
                    success:
                      default: false
                      description: Indicates if the operation was successful (false for errors)
                      type: boolean
                    error:
                      description: Error message
                      type: string
                    details:
                      description: Additional error details (validation errors, invalid permissions)
                  required:
                    - success
                    - error
                  additionalProperties: false
                components: {}
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Forbidden - Insufficient permissions
                  type: object
                  properties:
                    success:
                      default: false
                      description: Indicates if the operation was successful (false for errors)
                      type: boolean
                    error:
                      description: Error message
                      type: string
                    details:
                      description: Additional error details (validation errors, invalid permissions)
                  required:
                    - success
                    - error
                  additionalProperties: false
                components: {}
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Conflict - Role ID or name already exists
                  type: object
                  properties:
                    success:
                      default: false
                      description: Indicates if the operation was successful (false for errors)
