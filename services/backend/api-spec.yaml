    put:
      summary: Update role
      tags:
        - Roles
      description: Updates an existing role. System roles cannot be updated. Requires
        role management permissions.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
                  minItems: 1
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
          description: Role ID
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Role updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                        nullable: true
                      permissions:
                        type: array
                        items:
                          type: string
                      is_system_role:
                        type: boolean
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                    required:
