openapi: 3.0.0
info:
  title: DeployStack Backend API
  description: API documentation for DeployStack Backend
  version: 0.20.5
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_session
  schemas: {}
paths:
  /:
    get:
      summary: API health check
      tags:
        - Health Check
      description: Returns the health status of the DeployStack Backend API, including
        database connection status and basic service information. This endpoint
        can be used for monitoring and health checks.
      responses:
        "200":
          description: API health check information
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Service status message
                  status:
                    type: string
                    description: Database connection status
                  timestamp:
                    type: string
                    description: Current server timestamp
                  version:
                    type: string
                    description: API version (configurable via global.show_version setting)
                required:
                  - message
                  - status
                  - timestamp
                additionalProperties: false
                description: API health check information
  /api/health:
    get:
      summary: Simple API health check
      tags:
        - Health Check
      description: Returns basic API health status for monitoring, load balancers, and
        uptime checks. No Content-Type header required for this GET request.
      responses:
        "200":
          description: Simple health check response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                    description: Health status indicator
                required:
                  - status
                additionalProperties: false
                description: Simple health check response
  /api/db/status:
    get:
      summary: Get database status
      tags:
        - Database
      description: Returns the current status of the database configuration and
        initialization. This endpoint checks whether the database has been
        configured and properly initialized.
      responses:
        "200":
          description: Database status information
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  initialized:
                    type: boolean
                  dialect:
                    type: string
                    enum:
                      - sqlite
                      - turso
                    nullable: true
                required:
                  - configured
                  - initialized
                  - dialect
                additionalProperties: false
                description: Database status information
        "500":
          description: Internal Server Error - Failed to fetch database status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message describing what went wrong.
                required:
                  - error
                additionalProperties: false
                description: Internal Server Error - Failed to fetch database status
  /api/db/setup:
    post:
      summary: Setup database
      tags:
        - Database
      description: Initializes and configures the database for the DeployStack
        application. This endpoint sets up the database schema, creates
        necessary tables, and initializes database-dependent services. Can only
        be called once - subsequent calls will return a conflict error.
      responses:
        "200":
          description: Database setup completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message indicating the database setup status.
                  restart_required:
                    type: boolean
                    description: Indicates whether a server restart is required to complete the
                      setup.
                  database_type:
                    type: string
                    description: The type of database that was configured.
                required:
                  - message
                  - restart_required
                  - database_type
                additionalProperties: false
                description: Database setup completed successfully
        "400":
          description: Bad Request - Invalid input or unsupported database type
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message describing what went wrong.
                  details:
                    description: Additional error details.
                required:
                  - error
                additionalProperties: false
                description: Bad Request - Invalid input or unsupported database type
        "409":
          description: Conflict - Database setup has already been performed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Message indicating that database setup has already been performed.
                  database_type:
                    type: string
                    description: The type of database that is currently configured.
                required:
                  - message
                  - database_type
                additionalProperties: false
                description: Conflict - Database setup has already been performed
        "500":
          description: Internal Server Error - Database setup failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message describing what went wrong.
                  details:
                    description: Additional error details.
                required:
                  - error
                additionalProperties: false
                description: Internal Server Error - Database setup failed
  /api/roles:
    get:
      summary: List all roles
      tags:
        - Roles
      description: Retrieves a list of all roles in the system. Requires role
        management permissions.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Successfully retrieved roles list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        permissions:
                          type: array
                          items:
                            type: string
                        is_system_role:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                      required:
                        - id
                        - name
                        - description
                        - permissions
                        - is_system_role
                        - created_at
                        - updated_at
                      additionalProperties: false
                    description: Array of roles
                required:
                  - success
                  - data
                additionalProperties: false
                description: Successfully retrieved roles list
        "401":
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful (false for errors)
                    default: false
                  error:
                    type: string
                    description: Error message
                  details:
                    description: Additional error details (validation errors, invalid permissions)
                required:
                  - error
                additionalProperties: false
                description: Unauthorized - Authentication required
        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful (false for errors)
                    default: false
                  error:
                    type: string
                    description: Error message
                  details:
                    description: Additional error details (validation errors, invalid permissions)
                required:
                  - error
                additionalProperties: false
                description: Forbidden - Insufficient permissions
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful (false for errors)
                    default: false
                  error:
                    type: string
                    description: Error message
                  details:
                    description: Additional error details (validation errors, invalid permissions)
                required:
                  - error
                additionalProperties: false
                description: Internal Server Error
    post:
      summary: Create new role
      tags:
        - Roles
      description: Creates a new role with specified permissions. Requires role
        management permissions.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
                  minItems: 1
              required:
                - id
                - name
                - permissions
              additionalProperties: false
        required: true
      security:
        - cookieAuth: []
      responses:
        "201":
          description: Role created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                        nullable: true
                      permissions:
                        type: array
                        items:
                          type: string
                      is_system_role:
                        type: boolean
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                    required:
                      - id
                      - name
                      - description
                      - permissions
                      - is_system_role
                      - created_at
                      - updated_at
                    additionalProperties: false
                    description: Role data
                  message:
                    type: string
                    description: Success message
                required:
                  - success
                additionalProperties: false
                description: Role created successfully
        "400":
          description: Bad Request - Validation error or invalid permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful (false for errors)
                    default: false
                  error:
                    type: string
                    description: Error message
                  details:
                    description: Additional error details (validation errors, invalid permissions)
                required:
                  - error
                additionalProperties: false
                description: Bad Request - Validation error or invalid permissions
        "401":
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful (false for errors)
                    default: false
                  error:
                    type: string
                    description: Error message
                  details:
                    description: Additional error details (validation errors, invalid permissions)
                required:
                  - error
                additionalProperties: false
                description: Unauthorized - Authentication required
        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful (false for errors)
                    default: false
                  error:
                    type: string
                    description: Error message
                  details:
                    description: Additional error details (validation errors, invalid permissions)
                required:
                  - error
                additionalProperties: false
                description: Forbidden - Insufficient permissions
        "409":
          description: Conflict - Role ID or name already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful (false for errors)
                    default: false
                  error:
                    type: string
                    description: Error message
                  details:
                    description: Additional error details (validation errors, invalid permissions)
                required:
                  - error
                additionalProperties: false
                description: Conflict - Role ID or name already exists
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the operation was successful (false for errors)
                    default: false
                  error:
                    type: string
                    description: Error message
                  details:
                    description: Additional error details (validation errors, invalid permissions)
                required:
                  - error
                additionalProperties: false
                description: Internal Server Error
