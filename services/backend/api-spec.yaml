  /api/oauth2/auth:
    get:
      summary: OAuth2 Authorization Endpoint
      tags:
        - OAuth2
      description: Initiates OAuth2 authorization flow with PKCE. Validates client
        credentials and redirects to consent page for user authorization.
      parameters:
        - schema:
            type: object
            properties:
              response_type:
                description: OAuth2 response type, must be "code"
                type: string
                enum:
                  - code
              client_id:
                description: OAuth2 client identifier
                type: string
                minLength: 1
              redirect_uri:
                description: OAuth2 redirect URI for callback
                type: string
                format: uri
              scope:
                description: Space-separated list of requested scopes
                type: string
              state:
                description: CSRF protection state parameter
                type: string
                minLength: 1
              code_challenge:
                description: PKCE code challenge
                type: string
                minLength: 1
              code_challenge_method:
                description: PKCE code challenge method, must be "S256"
                type: string
                enum:
                  - S256
            additionalProperties: false
          in: query
          name: schema
          required:
            - response_type
            - client_id
            - redirect_uri
            - scope
            - state
            - code_challenge
            - code_challenge_method
        - schema: {}
          in: query
          name: components
      responses:
        "302":
          description: Redirect to consent page or error redirect
          content:
            application/json:
              schema:
                type: string
                description: Redirect to consent page or error redirect
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Bad Request - Invalid parameters
                  type: object
                  properties:
                    error:
                      description: OAuth2 error code
                      type: string
                    error_description:
                      description: Human-readable error description
                      type: string
                  required:
                    - error
                    - error_description
                  additionalProperties: false
                components: {}
  /api/oauth2/token:
    post:
      summary: OAuth2 Token Endpoint
      tags:
        - OAuth2
      description: Exchanges authorization code for access token using PKCE, or
        refreshes access token using refresh token.
      requestBody:
        content:
          application/json:
            schema:
              schema:
                anyOf:
                  - type: object
                    properties:
                      grant_type:
                        description: OAuth2 grant type, must be "authorization_code"
                        type: string
                        enum:
                          - authorization_code
                      code:
                        description: Authorization code received from authorization endpoint
                        type: string
                        minLength: 1
                      redirect_uri:
                        description: OAuth2 redirect URI, must match the one used in authorization
                        type: string
                        format: uri
                      client_id:
                        description: OAuth2 client identifier
                        type: string
                        minLength: 1
                      code_verifier:
                        description: PKCE code verifier
                        type: string
                        minLength: 1
                    required:
                      - grant_type
                      - code
                      - redirect_uri
                      - client_id
                      - code_verifier
                    additionalProperties: false
                  - type: object
                    properties:
                      grant_type:
                        description: OAuth2 grant type, must be "refresh_token"
                        type: string
                        enum:
                          - refresh_token
                      refresh_token:
                        description: Refresh token to exchange for new access token
                        type: string
                        minLength: 1
                      client_id:
                        description: OAuth2 client identifier
                        type: string
                        minLength: 1
                    required:
                      - grant_type
                      - refresh_token
                      - client_id
                    additionalProperties: false
              components: {}
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Successful token response
                  type: object
                  properties:
                    access_token:
                      description: OAuth2 access token
                      type: string
                    token_type:
                      description: Token type, always "Bearer"
                      type: string
                      enum:
                        - Bearer
                    expires_in:
                      description: Access token lifetime in seconds
                      type: number
                    refresh_token:
                      description: Refresh token for obtaining new access tokens
                      type: string
                    scope:
                      description: Space-separated list of granted scopes
                      type: string
                  required:
                    - access_token
                    - token_type
                    - expires_in
                    - refresh_token
                    - scope
                  additionalProperties: false
                components: {}
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Bad Request - Invalid parameters
                  type: object
                  properties:
                    error:
                      description: OAuth2 error code
                      type: string
                    error_description:
                      description: Human-readable error description
                      type: string
                  required:
                    - error
                    - error_description
                  additionalProperties: false
                components: {}
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Unauthorized - Invalid client or credentials
                  type: object
                  properties:
                    error:
                      description: OAuth2 error code
                      type: string
                    error_description:
                      description: Human-readable error description
                      type: string
                  required:
                    - error
                    - error_description
                  additionalProperties: false
                components: {}
