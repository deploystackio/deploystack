  /api/auth/github/login:
    get:
      summary: Initiate GitHub OAuth login
      tags:
        - Authentication
      description: Redirects the user to GitHub for OAuth authentication. This
        endpoint generates a state parameter for CSRF protection and redirects
        to GitHub's authorization URL.
      responses:
        "302":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Redirect to GitHub OAuth authorization URL
                  type: object
                  properties:
                    statusCode:
                      description: HTTP status code
                      type: number
                    headers:
                      description: Response headers
                      type: object
                      properties:
                        location:
                          description: Redirect URL
                          type: string
                      required:
                        - location
                      additionalProperties: false
                  required:
                    - statusCode
                    - headers
                  additionalProperties: false
                components: {}
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Forbidden - Login is disabled by administrator or GitHub OAuth is
                    disabled
                  type: object
                  properties:
                    error:
                      description: Error message
                      type: string
                  required:
                    - error
                  additionalProperties: false
                components: {}
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Internal Server Error
                  type: object
                  properties:
                    error:
                      description: Error message
                      type: string
                  required:
                    - error
                  additionalProperties: false
                components: {}
  /api/auth/github/callback:
    get:
      summary: GitHub OAuth callback
      tags:
        - Authentication
      description: Handles the OAuth callback from GitHub after user authorization.
        Validates the state parameter, exchanges the authorization code for
        tokens, retrieves user information, and creates or links user accounts.
        Sets authentication session cookie on success.
      parameters:
        - schema:
            type: object
            properties:
              code:
                type: string
              state:
                type: string
            additionalProperties: false
          in: query
          name: schema
          required:
            - code
            - state
        - schema: {}
          in: query
          name: components
      responses:
        "302":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Redirect to frontend after successful authentication
                  type: object
                  properties:
                    statusCode:
                      description: HTTP status code
                      type: number
                    headers:
                      description: Response headers
                      type: object
                      properties:
                        location:
                          description: Redirect URL
                          type: string
                      required:
                        - location
                      additionalProperties: false
                  required:
                    - statusCode
                    - headers
                  additionalProperties: false
                components: {}
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Bad Request - Invalid state parameter, OAuth error, or GitHub email
                    not available
                  type: object
                  properties:
                    error:
                      description: Error message
                      type: string
                  required:
                    - error
                  additionalProperties: false
                components: {}
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Forbidden - Login is disabled by administrator
                  type: object
                  properties:
                    error:
                      description: Error message
                      type: string
                  required:
                    - error
                  additionalProperties: false
                components: {}
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Conflict - User account conflict
                  type: object
                  properties:
                    error:
                      description: Error message
                      type: string
                  required:
                    - error
                  additionalProperties: false
                components: {}
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Internal Server Error
                  type: object
                  properties:
                    error:
                      description: Error message
                      type: string
