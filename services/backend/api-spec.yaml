      security:
        - cookieAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                schema:
                  description: Available permissions and default roles retrieved successfully
                  type: object
                  properties:
                    success:
                      description: Indicates if the operation was successful
                      type: boolean
                    data:
                      description: Permissions and default roles data
                      type: object
                      properties:
                        permissions:
                          description: Array of available permissions
                          type: array
                          items:
                            type: string
                        default_roles:
                          description: Default role permissions mapping
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            type: array
                            items:
                              type: string
                      required:
                        - permissions
                        - default_roles
