services:
  postgres:
    image: postgres:18-alpine
    container_name: deploystack-postgres
    environment:
      - POSTGRES_DB=deploystack
      - POSTGRES_USER=deploystack
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-deploystack}
    ports:
      - "5432:5432"
    volumes:
      - deploystack_postgres_data:/var/lib/postgresql/data
    networks:
      - deploystack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploystack -d deploystack"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: deploystack/backend:latest
    container_name: deploystack-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEPLOYSTACK_FRONTEND_URL=http://localhost:8080
      - DEPLOYSTACK_ENCRYPTION_SECRET=${DEPLOYSTACK_ENCRYPTION_SECRET:-CHANGE_ME_HERE}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=deploystack
      - POSTGRES_USER=deploystack
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-deploystack}
      - POSTGRES_SSL=false
    volumes:
      - deploystack_backend_persistent:/app/persistent_data
    networks:
      - deploystack-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: deploystack/frontend:latest
    container_name: deploystack-frontend
    ports:
      - "8080:80"
    environment:
      - VITE_DEPLOYSTACK_BACKEND_URL=http://localhost:3000
      - VITE_APP_TITLE=DeployStack
    networks:
      - deploystack-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  deploystack_postgres_data:
    driver: local
  deploystack_backend_persistent:
    driver: local

networks:
  deploystack-network:
    driver: bridge
