version: '3.8'

services:
  backend:
    image: deploystack/backend:latest
    container_name: deploystack-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEPLOYSTACK_FRONTEND_URL=http://localhost:8080
      - DEPLOYSTACK_ENCRYPTION_SECRET=${DEPLOYSTACK_ENCRYPTION_SECRET}
    volumes:
      - deploystack_backend_persistent:/app/persistent_data
    networks:
      - deploystack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  satellite:
    image: deploystack/satellite:latest
    container_name: deploystack-satellite
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LOG_LEVEL=info
      - DEPLOYSTACK_BACKEND_URL=http://backend:3000
      - DEPLOYSTACK_SATELLITE_NAME=docker-satellite-001
    networks:
      - deploystack-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: deploystack/frontend:latest
    container_name: deploystack-frontend
    ports:
      - "8080:80"
    environment:
      - VITE_DEPLOYSTACK_BACKEND_URL=http://localhost:3000
      - VITE_APP_TITLE=DeployStack
    networks:
      - deploystack-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      satellite:
        condition: service_healthy

volumes:
  deploystack_backend_persistent:
    driver: local

networks:
  deploystack-network:
    driver: bridge
