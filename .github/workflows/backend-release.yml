name: Backend Release
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'services/backend/**'
  
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'backend') && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.APP_INSTALLATION_TOKEN }}
          
      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          
      - name: Install dependencies
        run: npm ci
          
      - name: Create Release
        working-directory: services/backend
        env:
          GITHUB_TOKEN: ${{ secrets.APP_INSTALLATION_TOKEN }}
        run: |
          # Let release-it handle the release process properly
          npm run release -- --ci --verbose --no-git.requireCleanWorkingDir
        
      - name: Get version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@main
        with:
          path: services/backend
          
      - name: Build backend
        working-directory: services/backend
        run: npm run build
      
      - name: Prepare shared directories
        run: |
          mkdir -p /tmp/shared
          cp -r services/shared/* /tmp/shared/
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            deploystack/backend:latest
            deploystack/backend:v${{ steps.package-version.outputs.current-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
